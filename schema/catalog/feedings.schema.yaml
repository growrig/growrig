# JSON Schema (2020-12) for built-in feeding schedules:
# species/<species-id>/feedings.yaml. Read-only nutrient charts seeded into new
# recipes; the doses are per product key across free-form weekly phases.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://growrig.dev/schema/catalog/feedings.json
title: GrowRig feeding schedules
description: Built-in nutrient schedules (presets) shipped for a species.
type: object
additionalProperties: false
required: [presets]
properties:
  presets:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, name, products, phases]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
        name:
          type: string
          minLength: 1
        brand:
          type: string
        description:
          type: string
        unit:
          description: Default dose unit (e.g. "ml/L"); a product may override it.
          type: string
        products:
          description: The nutrient lines dosed by this schedule.
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [key]
            properties:
              key:
                type: string
                minLength: 1
              label:
                type: string
              unit:
                type: string
              basis:
                description: >-
                  What a dose is measured against. Omitted means per litre of
                  nutrient solution. Dry amendments are dosed per plant, per pot,
                  or per litre of substrate.
                enum: [plant, pot, substrate]
        phases:
          description: >-
            Ordered named spans. A phase is either weekly (per-week doses) or
            event-triggered (a single application at planting, transplant or
            top-dress), never both.
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
              stage:
                description: Optional link to one of the species' cultivation stages.
                type: string
              trigger:
                description: >-
                  Event this phase is applied at. Omit for an ordinary weekly
                  phase. A triggered phase has no position on the week timeline.
                enum: [planting, transplant, topdress]
              doses:
                description: >-
                  One-shot doses for a triggered phase: product key → amount in
                  the product's (or preset's) unit.
                type: object
                additionalProperties:
                  type: number
                  minimum: 0
              weeks:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    doses:
                      description: product key → dose amount in the product's (or preset's) unit.
                      type: object
                      additionalProperties:
                        type: number
                        minimum: 0
            allOf:
              # Weekly phases need weeks; triggered ones need doses instead.
              - if:
                  not: { required: [trigger] }
                then:
                  required: [weeks]
              - if:
                  required: [trigger]
                then:
                  required: [doses]
                  properties:
                    weeks: { maxItems: 0 }
